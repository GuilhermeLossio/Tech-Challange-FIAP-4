name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall src scripts

      - name: Lint Python fatal errors
        run: python -m flake8 src tests scripts --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: python -m pytest tests -q
