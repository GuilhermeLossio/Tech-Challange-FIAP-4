<svg width="100%" viewBox="0 0 980 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Quantum Hardware Execution Loop</title>
  <desc>Diagram showing why real IBM Quantum training is expensive: a classical optimizer repeatedly proposes circuit weights, the Qiskit Sampler executes noisy circuits with many shots, and the measured loss drives the next optimizer step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #111827; font: 700 24px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 14px Arial, sans-serif; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; }
      .classical { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .quantum { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
      .cost { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .safe { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .label { fill: #111827; font: 700 14px Arial, sans-serif; }
      .small { fill: #475569; font: 400 12px Arial, sans-serif; }
      .tiny { fill: #64748b; font: 400 11px Arial, sans-serif; }
      .wire { stroke: #334155; stroke-width: 1.8; fill: none; }
      .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="980" height="600"/>
  <text class="title" x="40" y="42">Real hardware execution loop and budget controls</text>
  <text class="subtitle" x="40" y="66">Training is hybrid: the optimizer is classical, but each loss evaluation calls the quantum sampler.</text>
  <text class="subtitle" x="40" y="84">On real hardware this can consume queue time, shots, and IBM Quantum minutes.</text>

  <rect class="classical" x="55" y="125" width="210" height="88" rx="8"/>
  <text class="label" x="160" y="153" text-anchor="middle">1. Classical optimizer</text>
  <text class="small" x="160" y="176" text-anchor="middle">SPSA for noisy hardware</text>
  <text class="tiny" x="160" y="194" text-anchor="middle">proposes theta weights</text>

  <line class="wire" x1="265" y1="169" x2="340" y2="169" marker-end="url(#arrow)"/>

  <rect class="quantum" x="340" y="116" width="300" height="112" rx="8"/>
  <text class="label" x="490" y="144" text-anchor="middle">2. Parameterized VQC circuit</text>
  <text class="small" x="490" y="168" text-anchor="middle">ZZFeatureMap(x)</text>
  <text class="small" x="490" y="188" text-anchor="middle">+ RealAmplitudes(theta)</text>
  <text class="tiny" x="490" y="208" text-anchor="middle">2-3 qubits, reps=1, shallow depth</text>

  <line class="wire" x1="640" y1="169" x2="710" y2="169" marker-end="url(#arrow)"/>

  <rect class="quantum" x="710" y="125" width="215" height="88" rx="8"/>
  <text class="label" x="817" y="153" text-anchor="middle">3. Sampler execution</text>
  <text class="small" x="817" y="176" text-anchor="middle">shots = 128 to 256</text>
  <text class="tiny" x="817" y="194" text-anchor="middle">measurement distributions</text>

  <line class="wire" x1="817" y1="213" x2="817" y2="286" marker-end="url(#arrow)"/>

  <rect class="cost" x="690" y="286" width="255" height="104" rx="8"/>
  <text class="label" x="817" y="314" text-anchor="middle">4. Noisy objective value</text>
  <text class="small" x="817" y="338" text-anchor="middle">loss estimated from measurements</text>
  <text class="small" x="817" y="358" text-anchor="middle">noise can require repeated</text>
  <text class="small" x="817" y="376" text-anchor="middle">evaluations</text>

  <path class="wire" d="M690 340 C520 456, 255 445, 160 213" marker-end="url(#arrow)"/>
  <text class="tiny" x="380" y="436" text-anchor="middle">repeat for maxiter / function evaluations</text>

  <rect class="safe" x="55" y="286" width="270" height="142" rx="8"/>
  <text class="label" x="190" y="314" text-anchor="middle">Safe simulator path</text>
  <text class="small" x="190" y="340" text-anchor="middle">--quantum-mode local</text>
  <text class="small" x="190" y="362" text-anchor="middle">FakeManilaV2 + Runtime Sampler</text>
  <text class="small" x="190" y="384" text-anchor="middle">No IBM minutes consumed</text>
  <text class="tiny" x="190" y="408" text-anchor="middle">Use for repeated tests and reports</text>

  <rect class="warn" x="355" y="286" width="270" height="142" rx="8"/>
  <text class="label" x="490" y="314" text-anchor="middle">Cloud hardware path</text>
  <text class="small" x="490" y="340" text-anchor="middle">--quantum-mode cloud</text>
  <text class="small" x="490" y="362" text-anchor="middle">Consumes minutes and queue time</text>
  <text class="small" x="490" y="384" text-anchor="middle">Use one symbol and low budget</text>
  <text class="tiny" x="490" y="408" text-anchor="middle">Future guard: confirmation flag</text>

  <rect class="box" x="55" y="470" width="890" height="92" rx="8"/>
  <text class="label" x="80" y="498">Report fields to expose</text>
  <text class="small" x="80" y="524">execution_mode, backend_name, shots, optimizer, maxiter, function_evaluations, sample counts,</text>
  <text class="small" x="80" y="544">elapsed seconds, metric scores, and whether IBM minutes were consumed.</text>

  <path class="dash" d="M160 286 L160 232"/>
  <path class="dash" d="M490 286 L490 238"/>
</svg>
